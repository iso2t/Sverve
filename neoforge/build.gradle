plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

sourceSets {
    lifecycleCheck {
        java.srcDir(project(':common').file('src/integrationTest/java'))
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    hudCheck {
        java.srcDir(project(':common').file('src/integrationTest/java'))
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

neoForge {
    version = neoforge_version

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
        sverve_hud_check { sourceSet sourceSets.hudCheck }
        sverve_lifecycle_check { sourceSet sourceSets.lifecycleCheck }
    }
    runs {
        configureEach {
            loadedMods.set([project.neoForge.mods.getByName(project.mod_id)])
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file('runs/client'))
        }
        ['seed', 'verify'].each { phase ->
            create("lifecycle${phase.capitalize()}") {
                server()
                sourceSet = sourceSets.lifecycleCheck
                loadedMods.set([project.neoForge.mods.getByName(project.mod_id),
                                project.neoForge.mods.getByName('sverve_lifecycle_check')])
                systemProperty('sverve.check.phase', phase)
                programArguments.add 'nogui'
                gameDirectory = project.file('build/lifecycle-check')
            }
        }
        hudCheck {
            client()
            sourceSet = sourceSets.hudCheck
            loadedMods.set([project.neoForge.mods.getByName(project.mod_id),
                            project.neoForge.mods.getByName('sverve_hud_check')])
            gameDirectory = project.file('build/hud-check')
            programArguments.addAll '--quickPlaySingleplayer', 'thirst-check'
        }
        data {
            clientData()
            gameDirectory = this.mkdir(this.file('runs/data'))

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
            this.file('runs/server').createParentDirectories()
            gameDirectory = this.mkdir(this.file('runs/server'))
        }
    }
}

apply from: rootProject.file('gradle/lifecycle-check.gradle')

dependencies {
    implementation("com.iso2t.easyconfig:easyconfig-neoforge-${minecraft_version}:${easyconfig_version}") { transitive = false }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.register('prepareHudCheckWorld', Sync) {
    outputs.upToDateWhen { false }
    from {
        def saves = project(':fabric').file('build/client-gametest/saves')
        def fixture = saves.listFiles()?.findAll { new File(it, 'level.dat').isFile() }
            ?.max { new File(it, 'level.dat').lastModified() }
        if (fixture == null) throw new GradleException('Run :fabric:runClientGametest first to generate a test world.')
        fixture
    }
    into layout.buildDirectory.dir('hud-check/saves/thirst-check')
    doLast {
        def runDirectory = layout.buildDirectory.dir('hud-check').get().asFile
        new File(runDirectory, 'result.txt').text = 'RUNNING\n'
        new File(runDirectory, 'options.txt').text = '''onboardAccessibility:false
tutorialStep:none
renderDistance:5
simulationDistance:5
guiScale:2
pauseOnLostFocus:false
chatVisibility:2
soundCategory_music:0.0
maxFps:120
'''
    }
}

tasks.named('runHudCheck') {
    dependsOn tasks.named('prepareHudCheckWorld')
    doFirst {
        layout.buildDirectory.file('hud-check/result.txt').get().asFile.text = 'RUNNING\n'
    }
    doLast {
        def report = layout.buildDirectory.file('hud-check/result.txt').get().asFile
        if (!report.isFile() || !report.text.startsWith('PASS')) {
            throw new GradleException(report.isFile() ? report.text : 'The NeoForge HUD check did not finish.')
        }
    }
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}
