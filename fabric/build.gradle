plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
        content {
            includeGroup("com.terraformersmc")
        }
    }
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
    implementation("com.iso2t.easyconfig:easyconfig-fabric-${minecraft_version}:${easyconfig_version}") { transitive = false }
    implementation "com.terraformersmc:modmenu:21.0.0"
}

sourceSets {
    lifecycleCheck {
        java.srcDir(project(':common').file('src/integrationTest/java'))
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    gametest {
        java.srcDir(project(':common').file('src/integrationTest/java'))
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

loom {
    mods {
        sverve { sourceSet sourceSets.main }
        sverve_test { sourceSet sourceSets.gametest }
        sverve_lifecycle_check { sourceSet sourceSets.lifecycleCheck }
    }
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        ['seed', 'verify'].each { phase ->
            create("lifecycle${phase.capitalize()}") {
                server()
                sourceSet.set('lifecycleCheck')
                vmArg "-Dsverve.check.phase=${phase}"
                programArg 'nogui'
                ideConfigGenerated(false)
                runDir('build/lifecycle-check')
            }
        }
        clientGametest {
            client()
            sourceSet.set('gametest')
            vmArg '-Dfabric.client.gametest'
            vmArg '-Dfabric.client.gametest.modid=sverve_test'
            ideConfigGenerated(false)
            runDir('build/client-gametest')
        }
        gametest {
            server()
            sourceSet.set('gametest')
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('reports/gametest.xml').get().asFile}"
            ideConfigGenerated(false)
            runDir('build/gametest')
        }
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

apply from: rootProject.file('gradle/lifecycle-check.gradle')

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
